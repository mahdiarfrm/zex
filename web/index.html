<style>
/* Tokens: light theme first, dark overrides below. */
:root {
  --bg: #ffffff;
  --surface: #fafafa;
  --surface-2: #f5f5f5;
  --active: #e9e9e9;
  --border: #ebebeb;
  --border-strong: #d4d4d4;
  --border-input: #8c8c8c;
  --text: #0a0a0a;
  --text-muted: #666666;
  --text-faint: #707070;
  --accent: #0f766e;
  --on-accent: #ffffff;
  --run: #111111;
  --on-run: #ffffff;
  --danger: #b42318;
  --danger-weak: #fdecea;
  --success: #15803d;
  --warn: #9a5b06;
  --warn-weak: #fff4e0;
  --syn-key: #0f766e;
  --syn-string: #3f3f3f;
  --syn-number: #9a5b06;
  --syn-type: #a21caf;
  --syn-punct: #8a8a8a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Vazirmatn, Tahoma, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sidebar: 188px;
  --row: 44px;
  --gutter: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --surface: #141414; --surface-2: #262626; --active: #2c2c2c;
    --border: #2e2e2e; --border-strong: #3d3d3d; --border-input: #6e6e6e;
    --text: #f2f2f2; --text-muted: #a3a3a3; --text-faint: #949494;
    --accent: #2dd4bf; --on-accent: #0a0a0a; --run: #f2f2f2; --on-run: #0a0a0a;
    --danger: #f87171; --danger-weak: #3a1717; --success: #4ade80; --warn: #fbbf24; --warn-weak: #3a2a0a;
    --syn-key: #5eead4; --syn-string: #d4d4d4; --syn-number: #fbbf24; --syn-type: #f0abfc; --syn-punct: #8a8a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --surface: #141414; --surface-2: #262626; --active: #2c2c2c;
  --border: #2e2e2e; --border-strong: #3d3d3d; --border-input: #6e6e6e;
  --text: #f2f2f2; --text-muted: #a3a3a3; --text-faint: #949494;
  --accent: #2dd4bf; --on-accent: #0a0a0a; --run: #f2f2f2; --on-run: #0a0a0a;
  --danger: #f87171; --danger-weak: #3a1717; --success: #4ade80; --warn: #fbbf24; --warn-weak: #3a2a0a;
  --syn-key: #5eead4; --syn-string: #d4d4d4; --syn-number: #fbbf24; --syn-type: #f0abfc; --syn-punct: #8a8a8a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--text); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

/* ---------- app grid ---------- */
.app {
  height: 100vh; display: grid;
  grid-template-columns: var(--sidebar) minmax(330px, 37%) minmax(0, 1fr);
}
.app.sb-collapsed { --sidebar: 56px; }
.app.layout-cols { grid-template-columns: var(--sidebar) minmax(560px, 58%) minmax(0, 1fr); }

/* ---------- sidebar ---------- */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px; margin-bottom: 14px; }
.mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 13px/1 var(--sans); flex: none; }
.brand-name { font-weight: 650; font-size: 13px; letter-spacing: .04em; margin-right: auto; white-space: nowrap; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text-muted); border-radius: 4px; flex: none; }
.icon-btn:hover { color: var(--text); background: var(--active); }
.icon-btn[aria-pressed="true"] { background: var(--active); color: var(--text); }
.nav-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; color: var(--text); white-space: nowrap; }
.nav-item:hover { background: var(--active); }
.nav-item.active { background: var(--active); }
.nav-item .ext { margin-left: auto; color: var(--text-muted); }
.sb-spacer { flex: 1; }
.server-card { border: 1px solid var(--border-strong); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.server-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex: none; }
.dot.ok { background: var(--success); }
.dot.bad { background: var(--danger); }
.theme-row { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; color: var(--text-muted); font-size: 13px; border-radius: 6px; }
.theme-row:hover { background: var(--active); color: var(--text); }
.app.sb-collapsed .brand-name, .app.sb-collapsed .nav-item span, .app.sb-collapsed .nav-item .ext,
.app.sb-collapsed .server-card, .app.sb-collapsed .theme-row span { display: none; }
.app.sb-collapsed .brand { flex-direction: column; height: auto; gap: 8px; }
.app.sb-collapsed .nav-item, .app.sb-collapsed .theme-row { justify-content: center; padding: 0; }

/* ---------- editor column ---------- */
.editor-col { background: var(--bg); border-right: 1px solid var(--border); display: grid; min-height: 0; min-width: 0;
  grid-template-rows: var(--row) var(--row) minmax(80px, 1fr) var(--row) minmax(120px, 1fr) var(--row);
  grid-template-areas: "tb" "sh" "sb" "qh" "qb" "bb"; }
.app.layout-cols .editor-col { grid-template-columns: 1fr 1fr; grid-template-rows: var(--row) var(--row) minmax(0, 1fr) var(--row);
  grid-template-areas: "tb tb" "sh qh" "sb qb" "bb bb"; }
.app.layout-cols .sec-head.q, .app.layout-cols .sec-body.q { border-left: 1px solid var(--border); }
.toolbar { grid-area: tb; }
.sec-head.s { grid-area: sh; } .sec-body.s { grid-area: sb; }
.sec-head.q { grid-area: qh; } .sec-body.q { grid-area: qb; }
.bottombar { grid-area: bb; }
.toolbar, .sec-head, .bottombar, .out-head { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); min-width: 0; }
.toolbar .title { display: flex; align-items: center; gap: 8px; color: var(--text-muted); margin-right: auto; }
/* macOS app: no title bar; the window buttons sit over the top of the sidebar */
html[data-desktop="mac"] .sidebar { padding-top: 44px; }
html[data-desktop="mac"] .app.sb-collapsed .toolbar { padding-left: 34px; }
.text-btn { height: 30px; padding: 0 10px; color: var(--text-muted); border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; }
.text-btn:hover { color: var(--text); background: var(--surface-2); }
.text-btn.bordered { border: 1px solid var(--border-strong); }
.text-btn.xs { font-size: 12px; height: 26px; padding: 0 6px; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.sec-head { color: var(--text-muted); }
.sec-head .name { margin-right: auto; }
.issues { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-muted); height: 26px; padding: 0 6px; border-radius: 4px; position: relative; }
.issues.has { color: var(--warn); }
.issues:hover { background: var(--surface-2); }
.issue-pop { position: absolute; right: 0; top: 30px; z-index: 20; width: 340px; background: var(--bg); border: 1px solid var(--border-strong); box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 8px 0; text-align: left; color: var(--text); font-size: 12.5px; }
.issue-pop div { padding: 4px 12px; }
.issue-pop .ok { color: var(--text-muted); }
.sec-body { overflow: auto; min-height: 0; padding: 12px 16px 16px 0; border-bottom: 1px solid var(--border); }
.sec-body.s.text-mode { padding: 0; }
.bottombar { border-bottom: 0; border-top: 1px solid var(--border); padding: 0 0 0 8px; gap: 8px; }
.chip-select { appearance: none; -webkit-appearance: none; background: var(--surface-2); border: 0; border-radius: 0; padding: 4px 26px 4px 10px; font: 12.5px var(--mono); color: var(--text);
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
.run { margin-left: auto; height: var(--row); padding: 0 22px; background: var(--run); color: var(--on-run); font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.run:hover { opacity: .9; }
.run:disabled, .run.idle { background: var(--surface-2); color: var(--text-faint); }
.run:disabled { cursor: default; }
.run kbd { font: 11px var(--mono); opacity: .65; }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* plain text state */
.state-text { display: block; width: 100%; height: 100%; min-height: 100%; border: 0; outline: none; resize: none; padding: 14px 16px; background: transparent; font-size: 15px; line-height: 1.7; }
.state-text::placeholder { color: var(--text-faint); }

/* ---------- code editor ---------- */
.ce { position: relative; font: 13px/21px var(--mono); }
.ce-row { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); }
.ce-num { color: var(--text-faint); text-align: right; padding-right: 12px; user-select: none; font-size: 12px; }
.ce-line { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); padding: 0 10px; min-height: 21px; tab-size: 2; color: var(--syn-string); }
.ce-row:first-child .ce-line { padding-top: 6px; } .ce-row:first-child .ce-num { padding-top: 6px; }
.ce-row:last-child .ce-line { padding-bottom: 6px; }
.ce-input { position: absolute; top: 0; bottom: 0; left: var(--gutter); right: 0; width: calc(100% - var(--gutter)); margin: 0; border: 0; outline: none; resize: none; overflow: hidden;
  padding: 6px 10px; background: transparent; color: transparent; caret-color: var(--text); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.ce-input::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.ce-input::placeholder { color: var(--text-faint); }
.ce:focus-within .ce-line { background: color-mix(in srgb, var(--surface-2) 70%, var(--active)); }
.t-key { color: var(--syn-key); } .t-str { color: var(--syn-string); } .t-num { color: var(--syn-number); }
.t-type { color: var(--syn-type); } .t-punct { color: var(--syn-punct); } .t-kw { color: var(--syn-number); }

/* primitive picker */
.picker { margin: 4px 0 0 var(--gutter); }
.picker .brace { font: 13px/21px var(--mono); color: var(--syn-punct); background: var(--surface-2); padding: 0 10px; }
.picker .inner { padding: 10px 0 10px 24px; }
.picker-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px; color: var(--text); }
.picker-head a { color: var(--accent); }
.prim { display: block; width: 100%; text-align: left; border: 1px solid var(--border-strong); padding: 10px 14px; background: var(--bg); }
.prim + .prim { border-top: 0; }
.prim:hover { background: var(--surface-2); }
.prim b { font-weight: 550; margin-right: 8px; }
.prim .ex { display: block; margin-top: 3px; color: var(--text-muted); font-size: 12.5px; font-style: italic; }
.prim code { font: 12px var(--mono); font-style: italic; }
.pop-picker { position: absolute; bottom: calc(var(--row) + 6px); left: 8px; z-index: 30; width: min(440px, 90vw); background: var(--bg); border: 1px solid var(--border-strong); box-shadow: 0 12px 32px rgba(0,0,0,.2); padding: 10px; }
.pop-picker .picker { margin: 0; }
.pop-picker .picker .inner { padding: 0; }

/* ---------- output column ---------- */
.out-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.out-head { background: var(--bg); gap: 6px; flex: none; height: var(--row); }
.out-head .name { color: var(--text-muted); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.out-head .name b { font-weight: 500; color: var(--text); }
.out-body { flex: 1; overflow: auto; min-height: 0; }

/* examples panel */
.examples { max-width: 820px; margin: 0 auto; width: calc(100% - 56px); border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--bg); min-height: 100%; position: relative; }
.ex-close { position: absolute; top: 14px; right: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.ex-hero { padding: 56px 24px 22px; border-bottom: 1px solid var(--border); }
.ex-hero h2 { margin: 6px 0 0; font-size: clamp(30px, 3.2vw, 46px); line-height: 1.05; font-weight: 650; letter-spacing: -.035em; }
.ex-hero p { margin: 12px 0 0; color: var(--text-muted); max-width: 520px; }
.ex-sec { padding: 34px 24px 12px; }
.lessons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
.lesson { position: relative; text-align: center; padding: 34px 10px 20px; border-right: 1px solid var(--border-strong); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lesson:last-child { border-right: 0; }
.lesson:hover { background: var(--surface-2); }
.lesson .tag { position: absolute; top: 0; right: 0; background: var(--text); color: var(--bg); font-size: 12px; padding: 1px 8px; }
.lesson svg { width: 76px; height: 76px; stroke: var(--text); stroke-width: 1.4; fill: none; margin-bottom: 18px; }
.lesson .t { font-weight: 500; }
.lesson .s { color: var(--text-muted); }
.cases { border-top: 1px solid var(--border-strong); }
.case { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 15px 24px; border-bottom: 1px solid var(--border-strong); flex-wrap: wrap; }
.case:hover { background: var(--surface-2); }
.case b { font-weight: 550; }
.case span { color: var(--text-muted); }

/* response table */
.resp { background: var(--bg); min-height: 100%; }
.r-grid { display: grid; grid-template-columns: 36px minmax(0, 1.25fr) minmax(0, 1fr) 104px; column-gap: 12px; }
.r-head { padding: 10px 12px 10px 4px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 13px; align-items: center; }
.r-head .timing { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-head .timing u { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.r-head .ty { text-align: right; }
.r-row { padding: 14px 12px 16px 4px; border-bottom: 1px solid var(--border); }
.r-row .chev { justify-self: center; width: 26px; height: 26px; }
.r-row .chev svg { transition: transform .15s; }
.r-row.collapsed .chev svg { transform: rotate(-90deg); }
.r-key { font: 500 14px var(--mono); overflow-wrap: anywhere; }
.r-instr { color: var(--text-muted); font-style: italic; font-size: 13px; margin-top: 4px; }
.opts { display: flex; flex-direction: column; gap: 3px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; font: 12.5px/20px var(--mono); color: var(--text-muted); }
.opt .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt.top { color: var(--text); }
.opt .pc { text-align: right; }
.ring { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.opt.top .ring { border: 3px solid var(--accent); }
.r-row.collapsed .opt:not(.top), .r-row.collapsed .scale-mini { display: none; }
.summary { margin-top: 8px; color: var(--text-muted); font-size: 13px; }
.scale-mini { position: relative; height: 14px; margin: 8px 24px 0 2px; }
.scale-mini .ln { position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--border-strong); }
.scale-mini .tk { position: absolute; top: 3px; width: 1px; height: 8px; background: var(--text-faint); }
.scale-mini .mk { position: absolute; top: 1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.r-type { text-align: right; }
.type-chip { display: inline-block; background: var(--surface-2); font: 12px var(--mono); padding: 2px 8px; color: var(--text-muted); }
.r-type .n { display: block; margin-top: 6px; color: var(--text-muted); font-size: 12.5px; }
.banner { margin: 16px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap; }
.banner.err { background: var(--danger-weak); color: var(--danger); font-family: var(--mono); font-size: 12px; }
.banner.warn { background: var(--warn-weak); color: var(--warn); }
.skel { height: 12px; background: var(--surface-2); margin: 4px 0; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.empty-hint { padding: 40px 24px; color: var(--text-muted); text-align: center; }

/* code view */
.code-view { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); min-height: 100%; }
.code-tabs { display: flex; gap: 4px; }
.code-tabs button { height: 28px; padding: 0 10px; color: var(--text-muted); font-size: 13px; }
.code-tabs button[aria-selected="true"] { background: var(--active); color: var(--text); }
pre.code { margin: 0; padding: 12px 14px; background: var(--surface-2); font: 12.5px/1.6 var(--mono); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.code-actions { display: flex; justify-content: flex-end; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .app, .app.layout-cols { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); }
  .sidebar { flex-direction: row; align-items: center; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); padding: 6px 10px; }
  .brand { margin: 0 auto 0 0; }
  .nav-item.ext-link, .sidebar a.server-card, .sb-spacer, #collapse { display: none; }
  .editor-col, .app.layout-cols .editor-col { height: 88vh; border-right: 0; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--row) var(--row) minmax(80px, 1fr) var(--row) minmax(120px, 1.25fr) var(--row);
    grid-template-areas: "tb" "sh" "sb" "qh" "qb" "bb"; }
  .app.layout-cols .sec-head.q, .app.layout-cols .sec-body.q { border-left: 0; }
  .out-col { min-height: 70vh; }
  .lessons { grid-template-columns: minmax(0, 1fr); }
  .lesson { border-right: 0; border-bottom: 1px solid var(--border-strong); }
  .ex-hero h2 { font-size: 34px; }
  .r-grid { grid-template-columns: 28px minmax(0, 1fr) 84px; }
  .r-grid > .mid { grid-column: 2 / 4; }
  .r-head .timing { grid-column: 2 / 3; }
}

/* ---------- design language: pixel windows, dot grids, crop marks, 3D mark, holo stickers ---------- */
@font-face { font-family: "VT323"; src: url("fonts/vt323-latin-400.woff2") format("woff2"); font-display: swap; }
:root { --pix: "VT323", var(--mono); --dot: color-mix(in srgb, var(--text) 14%, transparent); --hatch: color-mix(in srgb, var(--text) 10%, transparent); }
.pix { font-family: var(--pix); font-size: 18px; line-height: 1; letter-spacing: .01em; }
.mark { width: 30px; height: 30px; display: grid; place-items: center; color: var(--text); background: none; border-radius: 0; flex: none; }
.mark svg { width: 30px; height: 30px; overflow: visible; }
.win { border: 1.5px solid var(--text); background: var(--bg); position: relative; }
.win.shadow { box-shadow: 4px 4px 0 var(--text); }
.win-title { display: flex; align-items: center; gap: 8px; background: var(--text); color: var(--bg); padding: 1px 6px 2px; min-height: 22px; font-family: var(--pix); font-size: 18px; line-height: 19px; }
.win-title .grow { flex: 1; }
.win-title select { font: inherit; color: inherit; background: transparent; border: 0; padding: 0 2px; cursor: pointer; }
.win-title select option { color: #111; }
.win-body { padding: 10px 12px; }
.tagline { display: inline-block; background: var(--text); color: var(--bg); font-family: var(--pix); font-size: 18px; line-height: 20px; padding: 0 6px; }
.dots { background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 6px 6px; }
.corners { position: relative; }
.corners > i { position: absolute; width: 11px; height: 11px; border: 0 solid var(--text-muted); pointer-events: none; }
.corners > i.tl { top: -10px; left: -12px; border-width: 1px 0 0 1px; }
.corners > i.tr { top: -10px; right: -12px; border-width: 1px 1px 0 0; }

/* ---------- motion ---------- */
:root { --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-spring: cubic-bezier(.34, 1.56, .64, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes winIn { from { opacity: 0; transform: translateY(22px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes wordUp { from { opacity: 0; transform: translateY(.5em) rotate(2deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(22px, -16px) scale(1.07); } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success) 55%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
@keyframes breathe { 50% { opacity: .3; } }
@keyframes ringPop { 0% { transform: scale(.3); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes cellIn { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes barUp { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes floaty { 50% { translate: 0 -6px; } }
@keyframes flash { from { box-shadow: 0 0 0 0 var(--accent); } to { box-shadow: 0 0 0 12px transparent; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 8px); } }

.page > * { animation: rise .5s var(--ease-out) both; }
.enter > *, .enter.pane > * { animation: rise .45s var(--ease-out) both; }
.enter > *:nth-child(2) { animation-delay: .06s; } .enter > *:nth-child(3) { animation-delay: .12s; } .enter > *:nth-child(4) { animation-delay: .18s; }
.enter .r-row:not(.skeleton) { animation: rise .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 80ms + 60ms); }
.enter .opt.top .ring { animation: ringPop .5s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 80ms + 320ms); }
.enter .dchip { animation: pop .35s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 80ms + 420ms); }
.scale-mini .mk { transition: left .8s var(--ease-out); }
.giant .w { display: inline-block; animation: wordUp .9s var(--ease-out) both; animation-delay: calc(var(--i) * 75ms + 80ms); }
.tagline.cursor::after { content: "▌"; margin-left: 3px; animation: blink 1s steps(1) infinite; }
.home .hm-grid > .win, .home .opt-tile { animation: winIn .6s var(--ease-spring) backwards; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }
@keyframes skyDrift { 50% { transform: translate(-3%, 2.5%) scale(1.07); } }
.hm-sky::before { animation: skyDrift 22s ease-in-out infinite; }
.hm-leader { animation: fadeIn .8s .1s both; } .hm-leader .dl { animation: growX .9s var(--ease-out) .25s both; transform-origin: left; }
.hm-mark { animation: winIn .9s var(--ease-spring) .2s backwards; }
.hm-desk .win { transition: box-shadow .25s var(--ease-out), transform .25s var(--ease-out); }
.hm-desk .win:hover { box-shadow: 9px 9px 0 var(--desk-ink); transform: translate(-2px, -2px); }
.hm-recent .hist-item { animation: rise .45s var(--ease-out) backwards; animation-delay: calc(var(--j, 0) * 60ms + 320ms); }
.qr textarea { transition: border-color .2s, box-shadow .25s var(--ease-out); } .qr textarea:focus { box-shadow: 4px 4px 0 var(--text); }
.qr .run { transition: background .25s, color .25s, transform .12s; }
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out); }
.reveal.in { opacity: 1; transform: none; }
.reveal.in .barcode i { animation: barUp .45s var(--ease-out) both; transform-origin: bottom; animation-delay: calc(var(--i, 0) * 14ms + 200ms); }
.reveal.in .dotm i.on { animation: ringPop .45s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 22ms + 200ms); }
.reveal.in .dist .tr i { animation: growX .9s var(--ease-out) both; transform-origin: left; animation-delay: .25s; }
.opt-tile { transition: transform .25s var(--ease-out), box-shadow .25s var(--ease-out), background .2s; }
.opt-tile:hover { transform: translate(-4px, -4px); box-shadow: 6px 6px 0 var(--text); z-index: 1; }
.opt-tile svg.i { transition: transform .4s var(--ease-spring); } .opt-tile:hover svg.i { transform: rotate(-10deg) scale(1.15); }
.spec { transition: background .25s, transform .25s var(--ease-out); } .spec:hover { transform: translateY(-3px); }
.btn, .run, .text-btn, .icon-btn, .thr-chip, .otabs button { transition: transform .12s, background .18s, color .18s, box-shadow .18s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--text); }
.btn:active:not(:disabled), .run:active:not(:disabled), .icon-btn:active { transform: translateY(1px) scale(.97); box-shadow: none; }
.run.done { animation: flash .7s ease-out; }
.nav-item { transition: background .2s, transform .2s var(--ease-out); } .nav-item:hover { transform: translateX(3px); }
.case, .preset, .hist-item { transition: background .2s, transform .25s var(--ease-out); } .case:hover, .preset:hover, .hist-item:hover { transform: translateX(5px); }
.lesson { transition: background .2s; } .lesson .stk-wrap { animation: floaty 4.5s ease-in-out infinite; } .lesson:nth-child(2) .stk-wrap { animation-delay: -1.5s; } .lesson:nth-child(3) .stk-wrap { animation-delay: -3s; }
.dot { transition: background .3s; } .dot.ok { animation: ping 2.4s ease-out infinite; }
.dot:not(.ok):not(.bad):not(.warn) { animation: breathe 1s ease-in-out infinite; }
.thr-pop, .issue-pop, .pop-picker { animation: pop .22s var(--ease-out) both; transform-origin: top right; }
.pop-picker { transform-origin: bottom left; }
.nyb .zone { transition: left .25s var(--ease-out), width .25s var(--ease-out); }
.passgrid i.new { animation: cellIn .4s var(--ease-spring) both; }
.btable tbody tr.new { animation: rise .4s var(--ease-out) both; }
.term div { animation: fadeIn .3s both; animation-delay: calc(var(--i, 0) * 50ms); }
.r-row .chev svg { transition: transform .25s var(--ease-out); }
.prim, .q { transition: background .2s, border-color .2s; }
.ce-line { transition: background .2s; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 200; background: var(--text); color: var(--bg); font-family: var(--pix); font-size: 19px; line-height: 1; padding: 8px 14px; box-shadow: 4px 4px 0 var(--accent); animation: toastIn .35s var(--ease-spring) both; }
.toast.out { animation: toastOut .25s ease-in both; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }

/* ---------- boot splash ---------- */
#splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden; background: var(--bg); color: var(--text);
  clip-path: circle(150% at 50% 42%); transition: clip-path .75s cubic-bezier(.7, 0, .25, 1); }
#splash.out { clip-path: circle(0% at 50% 42%); pointer-events: none; }
.sp-sky { position: absolute; inset: -12%; opacity: .7; background:
  radial-gradient(30% 45% at 12% 10%, var(--sky-a), transparent 70%),
  radial-gradient(30% 45% at 88% 14%, var(--sky-b), transparent 70%),
  radial-gradient(34% 50% at 50% 100%, var(--sky-c), transparent 72%),
  radial-gradient(26% 40% at 92% 92%, var(--sky-a), transparent 70%); animation: skyDrift 16s ease-in-out infinite; }
.sp-dots { position: absolute; inset: 0; background-image: radial-gradient(color-mix(in srgb, var(--text) 13%, transparent) 1px, transparent 1.3px); background-size: 6px 6px;
  -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 62%); mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 62%); }
.sp-stage { position: relative; display: flex; flex-direction: column; align-items: center; transition: transform .75s cubic-bezier(.7, 0, .25, 1), opacity .5s; }
#splash.out .sp-stage { transform: scale(.92); opacity: 0; }
.sp-mark { position: relative; width: 210px; height: 210px; animation: spDrop 1s var(--ease-spring) both; }
.sp-name { display: flex; font-size: clamp(76px, 11vw, 140px); font-weight: 650; letter-spacing: -.065em; line-height: .86; margin: -6px 0 26px; }
.sp-name span { display: inline-block; animation: wordUp .8s var(--ease-out) both; animation-delay: calc(var(--i) * 90ms + 260ms); }
.sp-log { width: min(380px, 86vw); box-shadow: 5px 5px 0 var(--text); animation: winIn .6s var(--ease-spring) .5s both; }
.sp-log .win-body { padding: 10px 12px 12px; }
.sp-line { display: flex; align-items: baseline; gap: 6px; font-family: var(--pix); font-size: 19px; line-height: 1.3; animation: fadeIn .2s steps(2) both; animation-delay: calc(var(--d) * 320ms + 760ms); }
.sp-line i { flex: 1; border-bottom: 2px dotted var(--border-strong); transform: translateY(-5px); }
.sp-line b { font-weight: 400; min-width: 6ch; text-align: right; }
.sp-line b.ok { color: var(--success); } .sp-line b.warn { color: var(--warn); }
.sp-line b:empty::before { content: "▌"; animation: blink .8s steps(1) infinite; }
.sp-bar { display: flex; gap: 3px; height: 12px; margin-top: 12px; }
.sp-bar i { flex: 1; background: var(--text); transform-origin: bottom; animation: barUp .3s var(--ease-out) both; animation-delay: calc(var(--i) * 42ms + 760ms); }
@keyframes spDrop { from { opacity: 0; transform: translateY(-46px) scale(.6) rotate(-10deg); } }
.app.booting *, .app.booting *::before, .app.booting *::after { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>

(() => {
  // ---------------------------------------------------------------- data

  const LESSONS = [
    { type: "noul", t: "Is this a complaint?", s: "A yes-or-no with a probability",

      questions: { team: { type: "choice", instructions: "Which team should handle this?", criteria: { billing: "Charges, invoices and refunds", technical: "Bugs, crashes and sign-in problems", sales: "Plans, upgrades and quotes" } } } },
    { type: "score", t: "How urgent is it?", s: "A point on an ordered scale",

      questions: { urgency: { type: "score", instructions: "How urgent is this for the customer?", criteria: ["can wait", "this week", "today", "right now"] } } },

  const CASES = [
    { t: "Support triage", d: "Refund, team, frustration and churn for one ticket",
      state: "Third time this year you've double-charged me. Refund it today or I'm cancelling and moving to a competitor.",
      questions: {
        refund_requested: { type: "noul", instructions: "Is the customer asking for money back?" },
        team: { type: "choice", instructions: "Which team should handle this?", criteria: { billing: "Charges, invoices and refunds", technical: "Bugs, outages and errors", account: "Sign-in and account access" } },
        frustration: { type: "score", instructions: "How upset is the customer?", criteria: ["calm", "annoyed", "angry", "furious"] },
        churn_risk: { type: "noul", instructions: "Is the customer threatening to leave?" },

    { t: "Email routing", d: "Department, urgency and tone for an inbound email",

    const re = /("(?:\\.|[^"\\])*"?)(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],])/g;
    let out = "", i = 0, m, prevKey = null;
    while ((m = re.exec(line))) {
      out += esc(line.slice(i, m.index));
      if (m[1] !== undefined) {
        if (m[2] !== undefined) { out += `<span class="t-key">${esc(m[1])}</span><span class="t-punct">${esc(m[2])}</span>`; prevKey = m[1]; }

      else if (m[4] !== undefined) out += `<span class="t-kw">${m[4]}</span>`;

      i = re.lastIndex;

    return out + esc(line.slice(i));

      const m = /^#?([0-9a-f]{6})$/i.exec(getComputedStyle(desk).getPropertyValue("--desk-ink").trim());
      const v = m ? parseInt(m[1], 16) : 0x111111;
      return ((255 << 24) | ((v & 255) << 16) | (((v >> 8) & 255) << 8) | (v >> 16)) >>> 0; // RGBA bytes, little-endian
    };

      if (!cv.isConnected) return;
      if (!reduceMotion) requestAnimationFrame(draw);
      if (now - last < 38 || !visible) return; // ~25 fps is plenty for dots
      last = now;
      if (desk.clientWidth !== W || desk.clientHeight !== H) build();
      if (!W || !H) { if (reduceMotion) requestAnimationFrame(draw); return; }

      if (!img) { img = ctx.createImageData(cw, ch); buf = new Uint32Array(img.data.buffer); }
      buf.fill(0);
      const ink = inkOf(), ds = Math.max(2, Math.round(1.6 * dpr)), t = (now - t0) / 1000;
      const dot = (x, y) => {
        const X = x | 0, Y = y | 0;
        if (X < 0 || Y < 0 || X + ds > cw || Y + ds > ch) return;
        for (let j = 0; j < ds; j++) { const o = (Y + j) * cw + X; for (let i = 0; i < ds; i++) buf[o + i] = ink; }
      };
      for (const sh of shapes) {
        const ay = t * sh.spin + px * 1.2, ax = sh.tilt + (sh.tumble ? t * sh.spin * 0.7 : 0) + py * 0.8;
        const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);

          const nx = p[i + 3] * cy + p[i + 5] * sy, nz1 = -p[i + 3] * sy + p[i + 5] * cy;
          const ny = p[i + 4] * cx - nz1 * sx, nz = p[i + 4] * sx + nz1 * cx;
          if (nz < 0) continue;
          const lit = nx * LX + ny * LY + nz * LZ;
          if (p[i + 6] > Math.pow(1 - Math.max(0, lit), 1.5) * 0.93 + 0.04) continue;
          const x = p[i] * cy + p[i + 2] * sy, z1 = -p[i] * sy + p[i + 2] * cy;
          dot(ox + x * S, oy + (p[i + 1] * cx - z1 * sx) * S);
        }
      }
      for (const [x, y, k] of dust) if ((k * 10 + t * 0.5) % 1 < 0.6) dot(x * dpr, y * dpr);
      ctx.putImageData(img, 0, 0);
    };
    desk.addEventListener("pointermove", (e) => { const r = desk.getBoundingClientRect(); px = (e.clientX - r.left) / r.width - 0.5; py = (e.clientY - r.top) / r.height - 0.5; });
    new IntersectionObserver(([en]) => { visible = en.isIntersecting; }).observe(desk);
    desk.prepend(cv);
    requestAnimationFrame(draw);
    return desk;
  }

  // ---------------------------------------------------------------- boot splash

  function runSplash(booted) {
    const sp = $("#splash");
    if (!sp) return;
    let again = false;
    try { again = !!sessionStorage.getItem("zex.booted"); sessionStorage.setItem("zex.booted", "1"); } catch {}
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const mark = (el, text, ok) => { el.textContent = text; el.className = ok ? "ok" : "warn"; };
